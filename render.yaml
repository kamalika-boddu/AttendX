# Render Infrastructure as Code Blueprint for AttendX
services:
  # 1. Flask Backend REST API Web Service
  - type: web
    name: attendx-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: "*"
      # Connect with Managed Database
      - key: DATABASE_URL
        fromDatabase:
          name: attendx-db
          property: connectionString

  # 2. React Vite Frontend Static Site
  - type: web
    name: attendx-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: attendx-api
          property: host
          value: https://attendx-api.onrender.com/api

databases:
  # 3. Managed Database
  - name: attendx-db
    plan: free
    databaseName: attendx_db
    user: attendx_user
